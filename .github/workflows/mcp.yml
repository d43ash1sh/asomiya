name: MCP server

# Push a tag like mcp-v0.1.0 (matching mcp/package.json) after publishing that version to npm (see
# mcp/PUBLISHING.md). This builds the Claude Desktop extension (.mcpb), attaches it to a GitHub
# Release and publishes the listing to the MCP Registry, signed in with GitHub's OIDC token.

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.16

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: version
        name: Check the tag matches the server version
        shell: bash
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "mcp-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - name: Pack the Claude Desktop extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run mcp:build
          cd mcp
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "asomiya-$VERSION.mcpb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: mcp/*.mcpb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
      # --latest=false: the language release (vX.Y.Z), not the MCP server, stays "Latest".
      - name: Create (or update) the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          file="asomiya-$VERSION.mcpb"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" \
              --title "Asomiya MCP server $VERSION" --latest=false \
              --notes "Asomiya for AI assistants. Claude Desktop: download $file and double-click it. Other apps: run \`npx -y asomiya-mcp\` (see https://asomiya.codes/ai/). Changes: https://github.com/$GITHUB_REPOSITORY/blob/main/mcp/CHANGELOG.md"
          fi

  registry:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC sign-in to the MCP Registry; no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this version is on npm with its mcpName
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          name=$(npm view "asomiya-mcp@$VERSION" mcpName)
          if [ "$name" != "io.github.d43ash1sh/asomiya" ]; then
            echo "asomiya-mcp@$VERSION is not on npm (or has no mcpName). Publish it first." >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Download and verify mcp-publisher
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL -o "$file.sigstore.json" "$base/$file.sigstore.json"
          cosign verify-blob "$file" --bundle "$file.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          tar xzf "$file" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          cd mcp && ../mcp-publisher publish
