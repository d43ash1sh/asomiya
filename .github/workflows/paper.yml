# Builds a draft PDF of the JOSE paper (paper/paper.md) with the Open Journals toolchain.
# Download it from the run's "paper" artifact to check formatting before and during review.
name: JOSE paper draft

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Draft PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6 # master, 2026-09-23
        with:
          journal: jose
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper
          path: paper/paper.pdf
