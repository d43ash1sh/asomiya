name: VS Code extension

# Push a tag like vscode-v0.1.0 (matching editors/vscode/package.json) to build the .vsix and
# attach it to a GitHub Release. If the marketplace accounts are set up (see
# editors/vscode/PUBLISHING.md), the same file is also published to Open VSX and the VS Code
# Marketplace.

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: version
        name: Check the tag matches the extension version
        shell: bash
        run: |
          version=$(node -p "require('./editors/vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "vscode-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: npm run vscode:build
      - name: Package
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out "asomiya-vscode-${{ steps.version.outputs.version }}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      # --latest=false: the language release (vX.Y.Z), not the extension, stays "Latest".
      - name: Create (or update) the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          file="asomiya-vscode-$VERSION.vsix"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" \
              --title "Asomiya for VS Code $VERSION" --latest=false \
              --notes "Install: in VS Code open Extensions, click ⋯ and choose Install from VSIX…, then pick this file. Changes: https://github.com/$GITHUB_REPOSITORY/blob/main/editors/vscode/CHANGELOG.md"
          fi

  open-vsx:
    if: github.ref_type == 'tag' && vars.PUBLISH_OPEN_VSX == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment: marketplaces
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ needs.package.outputs.version }}
        run: npx --yes ovsx@1.3.0 publish "asomiya-vscode-$VERSION.vsix"

  vs-marketplace:
    if: github.ref_type == 'tag' && vars.PUBLISH_VS_MARKETPLACE == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment: marketplaces
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      # Microsoft Entra ID sign-in with GitHub's OIDC token: no long-lived secret to leak
      # (the Marketplace's personal access tokens are retired on 1 December 2026).
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: npx --yes @vscode/vsce@4.1.0 publish --azure-credential --packagePath "asomiya-vscode-$VERSION.vsix"
